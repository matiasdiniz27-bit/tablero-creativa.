<script>
(function(){
  const R=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
  function actual(){const m=R.getAttribute("data-mode");if(m==="light"||m==="dark")return m;const t=R.getAttribute("data-theme");if(t==="light"||t==="dark")return t;return mq.matches?"dark":"light"}
  function pintar(){const m=actual();document.querySelectorAll("[data-mode-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.modeSet===m)))}
  document.querySelector(".mode").addEventListener("click",e=>{const b=e.target.closest("[data-mode-set]");if(!b)return;R.setAttribute("data-mode",b.dataset.modeSet);try{localStorage.setItem("cpo:modo",b.dataset.modeSet)}catch(err){}pintar()});
  try{mq.addEventListener("change",pintar)}catch(e){}
  new MutationObserver(pintar).observe(R,{attributes:true,attributeFilter:["data-theme","data-mode"]});
  pintar();
})();
</script>
<script type="module">
  /* ---------- Firebase · Firestore + Auth ----------
     Inicializa Firebase, maneja la sesión de Google y expone a la app un
     adaptador con la misma forma que usa el resto del código
     (collection, doc, onSnapshot, set, delete, orderBy, limit). */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, getDoc, onSnapshot, query, orderBy as fsOrderBy, limit as fsLimit } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBPzOHz8H2bjJ95mftLxc7ye-3iMhLECbw",
    authDomain: "flujo-trabajo-cretiva-politica.firebaseapp.com",
    projectId: "flujo-trabajo-cretiva-politica",
    storageBucket: "flujo-trabajo-cretiva-politica.firebasestorage.app",
    messagingSenderId: "796668827723",
    appId: "1:796668827723:web:88ad574c902959ec5355ce"
  };

  const app = initializeApp(firebaseConfig);

  // Caché local persistente para trabajar sin conexión y sincronizar al volver
  let fs;
  try {
    fs = initializeFirestore(app, {
      ignoreUndefinedProperties: true,
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });
  } catch (e) {
    fs = initializeFirestore(app, { ignoreUndefinedProperties: true });
  }

  const auth = getAuth(app);
  auth.languageCode = "es";
  const proveedor = new GoogleAuthProvider();
  proveedor.setCustomParameters({ prompt: "select_account" });

  // Adaptador con la forma que espera la app
  const envolver = s => ({
    fromCache: s.metadata.fromCache,
    docs: s.docs.map(d => ({ id: d.id, data: () => d.data() }))
  });
  function coleccion(path, restricciones) {
    const ref = collection(fs, path), r = restricciones || [];
    return {
      doc() { const nuevo = doc(ref); return { id: nuevo.id }; },
      orderBy(campo, dir) { return coleccion(path, [...r, fsOrderBy(campo, dir)]); },
      limit(n) { return coleccion(path, [...r, fsLimit(n)]); },
      onSnapshot(cb, err) {
        return onSnapshot(r.length ? query(ref, ...r) : ref, s => cb(envolver(s)), e => { if (err) err(e); });
      }
    };
  }
  const db = {
    collection: path => coleccion(path),
    doc: path => {
      const ref = doc(fs, path);
      return {
        set: data => setDoc(ref, data),
        delete: () => deleteDoc(ref),
        onSnapshot: (cb, err) => onSnapshot(ref,
          d => cb({ id: d.id, exists: d.exists(), data: () => d.data() || {} }),
          e => { if (err) err(e); })
      };
    }
  };
  function usuario(u) {
    return {
      id: async () => u.uid,
      profiles: async ids => {
        const out = {};
        await Promise.all(ids.map(async id => {
          try {
            const d = await getDoc(doc(fs, "usuarios", id));
            if (d.exists()) out[id] = { name: d.data().nombre || d.data().correo || "" };
          } catch (e) {}
        }));
        return out;
      }
    };
  }

  window.cpoFB = {
    entrar: async () => {
      try { await signInWithPopup(auth, proveedor); }
      catch (e) {
        if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) return signInWithRedirect(auth, proveedor);
        throw e;
      }
    },
    salir: () => signOut(auth)
  };

  getRedirectResult(auth).catch(e => console.error(e));

  onAuthStateChanged(auth, u => {
    if (!u) { window.cpoSinSesion(); return; }
    const correo = (u.email || "").toLowerCase();

    const permitidos = [
    "aaronfigueroa2538@gmail.com",
    "tush.retamoso@gmail.com",
    "rampognac@gmail.com",
    "matiasdiniz27@gmail.com",
    "thyagott09@gmail.com"
];
if (!permitidos.includes(correo)) {
    alert("Acceso bloqueado. Para ingresar a este tablero es obligatorio solicitar autorización a Matías.");
    window.location.href = "mailto:matiasdiniz27@gmail.com?subject=Solicitud de acceso obligatoria al tablero Creativa";
    signOut(auth);
    return;
}
    // Perfil público mínimo para mostrar quién hizo cada cambio
    setDoc(doc(fs, "usuarios", u.uid), { nombre: u.displayName || correo, correo, visto: Date.now() }, { merge: true }).catch(() => {});
    window.cpoConectar({ db, user: usuario(u), correo, nombre: u.displayName || "" });
  });
</script>
